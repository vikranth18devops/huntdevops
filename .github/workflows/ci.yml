name: HuntDevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'documents/**'
      - 'README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enable_trivy_scan:
        description: 'Run Trivy Vulnerability Security Scan?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  # =============================================================
  # STAGE 1 (PARALLEL): Application Code Builds
  # =============================================================
  build-frontend:
    name: 1. Build Frontend React
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend React App
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

  build-backend:
    name: 1. Build Backend TypeScript
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Backend TypeScript API
        run: |
          npm ci
          npm run build
        working-directory: ./backend

  # =============================================================
  # STAGE 2 (PARALLEL): Docker Image Builds
  # =============================================================
  docker-build-frontend:
    name: 2. Docker Build (Frontend)
    needs: [build-frontend]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build -t huntdevops-frontend:${{ github.sha }} ./frontend

  docker-build-backend:
    name: 2. Docker Build (Backend)
    needs: [build-backend]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t huntdevops-backend:${{ github.sha }} ./backend

  # =============================================================
  # STAGE 3 (PARALLEL): On-Demand Trivy Security Scans
  # =============================================================
  trivy-scan-frontend:
    name: 3. Trivy Security Scan (Frontend)
    needs: [docker-build-frontend]
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event_name != 'workflow_dispatch' || inputs.enable_trivy_scan == true)
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Frontend Image for Scanning
        run: |
          docker build -t huntdevops-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy Vulnerability Scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'huntdevops-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  trivy-scan-backend:
    name: 3. Trivy Security Scan (Backend)
    needs: [docker-build-backend]
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event_name != 'workflow_dispatch' || inputs.enable_trivy_scan == true)
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Image for Scanning
        run: |
          docker build -t huntdevops-backend:${{ github.sha }} ./backend

      - name: Run Trivy Vulnerability Scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'huntdevops-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =============================================================
  # STAGE 4: Push to Artifact Registry & Update Helm (Main Branch)
  # =============================================================
  push-gar-and-update-helm:
    name: 4. GAR Push & Helm Tag Update
    needs: [docker-build-frontend, docker-build-backend, trivy-scan-frontend, trivy-scan-backend]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      needs.docker-build-frontend.result == 'success' &&
      needs.docker-build-backend.result == 'success' &&
      (needs.trivy-scan-frontend.result == 'success' || needs.trivy-scan-frontend.result == 'skipped') &&
      (needs.trivy-scan-backend.result == 'success' || needs.trivy-scan-backend.result == 'skipped')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sanitize GCP Variables & Set Image Tags
        id: prep
        run: |
          # Strip accidental carriage returns, newlines, and spaces from GitHub secrets
          RAW_PROJECT_ID="${{ secrets.GCP_PROJECT_ID || 'project-e746f24e-392a-429f-a4d' }}"
          RAW_REGION="${{ secrets.GCP_REGION || 'us-central1' }}"
          RAW_REPO="${{ secrets.GAR_REPOSITORY || 'huntdevops-repo' }}"

          CLEAN_PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '[:space:]')
          CLEAN_REGION=$(echo "$RAW_REGION" | tr -d '[:space:]')
          CLEAN_REPO=$(echo "$RAW_REPO" | tr -d '[:space:]')

          # Fallback defaults if empty
          [ -z "$CLEAN_PROJECT_ID" ] && CLEAN_PROJECT_ID="project-e746f24e-392a-429f-a4d"
          [ -z "$CLEAN_REGION" ] && CLEAN_REGION="us-central1"
          [ -z "$CLEAN_REPO" ] && CLEAN_REPO="huntdevops-repo"

          IMAGE_TAG="${{ github.sha }}"
          GAR_PREFIX="${CLEAN_REGION}-docker.pkg.dev/${CLEAN_PROJECT_ID}/${CLEAN_REPO}"

          echo "GCP_REGION_CLEAN=${CLEAN_REGION}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${GAR_PREFIX}/frontend" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${GAR_PREFIX}/backend" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud Platform (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || 'projects/174952050783/locations/global/workloadIdentityPools/huntdevops-pool/providers/huntdevops-provider' }}
          service_account: ${{ secrets.GCP_SA_EMAIL || 'huntdevops-cicd-sa@project-e746f24e-392a-429f-a4d.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker CLI for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION_CLEAN }}-docker.pkg.dev --quiet

      - name: Build & Push Frontend Image to GAR
        run: |
          docker build -t ${FRONTEND_IMAGE}:${IMAGE_TAG} -t ${FRONTEND_IMAGE}:latest ./frontend
          docker push ${FRONTEND_IMAGE}:${IMAGE_TAG}
          docker push ${FRONTEND_IMAGE}:latest

      - name: Build & Push Backend Image to GAR
        run: |
          docker build -t ${BACKEND_IMAGE}:${IMAGE_TAG} -t ${BACKEND_IMAGE}:latest ./backend
          docker push ${BACKEND_IMAGE}:${IMAGE_TAG}
          docker push ${BACKEND_IMAGE}:latest

      - name: Update Helm Chart Image References
        run: |
          HELM_VALUES="helm/huntdevops/values.yaml"
          
          # Update frontend and backend image tags specifically (leaving postgresql intact)
          sed -i '/^frontend:/,/^backend:/ s/tag: .*/tag: "'"${IMAGE_TAG}"'"/' ${HELM_VALUES}
          sed -i '/^backend:/,/^postgresql:/ s/tag: .*/tag: "'"${IMAGE_TAG}"'"/' ${HELM_VALUES}
          
          echo "Updated ${HELM_VALUES} with new tag: ${IMAGE_TAG}"
          git diff ${HELM_VALUES}

      - name: Commit & Push Updated Helm Chart Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add helm/huntdevops/values.yaml
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes in values.yaml to commit."
          else
            git commit -m "chore(helm): update container image tags to ${{ github.sha }} [skip ci]"
            git push origin main
          fi
