  namespace: huntdevops
spec:
  secretName: huntdevops-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: vikranthsunkarpally.in
  dnsNames:
    - vikranthsunkarpally.in
    - www.vikranthsunkarpally.in