<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Infinity Left Loop Gradient -->
    <linearGradient id="inf-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Infinity Right Loop Gradient -->
    <linearGradient id="inf-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ambient-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle Frame -->
  <rect width="128" height="128" rx="30" fill="url(#bg-grad)"/>
  <rect x="3" y="3" width="122" height="122" rx="27" stroke="url(#border-glow)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Ambient Glow Center -->
  <circle cx="64" cy="64" r="44" fill="url(#ambient-center)"/>

  <!-- Radar/Crosshair Target Rings (The "Hunt" Concept) -->
  <circle cx="64" cy="64" r="38" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <circle cx="64" cy="64" r="26" stroke="#475569" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4"/>
  
  <!-- Target Scope Crosshair Ticks -->
  <line x1="64" y1="18" x2="64" y2="28" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="110" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="64" x2="28" y2="64" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="64" x2="110" y2="64" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

  <!-- DevOps Infinity Loop (The "DevOps" Concept) -->
  <!-- Left Wing -->
  <path d="M64 64 C50 46 26 46 26 64 C26 82 50 82 64 64" 
        stroke="url(#inf-left)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#core-glow)"/>

  <!-- Right Wing -->
  <path d="M64 64 C78 82 102 82 102 64 C102 46 78 46 64 64" 
        stroke="url(#inf-right)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#core-glow)"/>

  <!-- Inner Center Accent Chevron & Terminal Cursor (>_) -->
  <path d="M46 64 L53 58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 64 L53 70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="57" y1="70" x2="63" y2="70" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Target Pulse Node Dots -->
  <circle cx="26" cy="64" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="102" cy="64" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
</svg>
