<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Left Infinity Wing Gradient (Dev/Cloud) -->
    <linearGradient id="inf-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Infinity Wing Gradient (Ops/Prod) -->
    <linearGradient id="inf-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Accent Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Ambient Core -->
    <radialGradient id="ambient-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Rounded Hexagonal Container / Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" />
  <rect x="20" y="20" width="472" height="472" rx="106" stroke="url(#border-glow)" stroke-width="10" stroke-opacity="0.9" fill="none" />

  <!-- 2. Ambient Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambient-core)" />

  <!-- 3. Target Scope Crosshair (The "Hunt" Radar / Precision Targeting) -->
  <circle cx="256" cy="256" r="150" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.4" fill="none" />
  <circle cx="256" cy="256" r="105" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 8" stroke-opacity="0.3" fill="none" />

  <!-- Target Ticks -->
  <line x1="256" y1="70" x2="256" y2="105" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="407" x2="256" y2="442" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" />
  <line x1="70" y1="256" x2="105" y2="256" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" />
  <line x1="407" y1="256" x2="442" y2="256" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" />

  <!-- 4. DevOps Infinity Loop with Bold Vivid Colors (Thick & Ultra-Visible) -->
  <!-- Left Loop -->
  <path d="M 256,256 C 200,175 110,175 110,256 C 110,337 200,337 256,256 Z"
        fill="none"
        stroke="url(#inf-left)"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow-heavy)" />

  <!-- Right Loop -->
  <path d="M 256,256 C 312,337 402,337 402,256 C 402,175 312,175 256,256 Z"
        fill="none"
        stroke="url(#inf-right)"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow-heavy)" />

  <!-- 5. Center Core Pulse Node -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" stroke="#6366f1" stroke-width="6" />
  <circle cx="110" cy="256" r="14" fill="#00f2fe" stroke="#ffffff" stroke-width="4" />
  <circle cx="402" cy="256" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="4" />

  <!-- 6. Inner Terminal Chevron ">" Prompt on Left Node (DevOps Code / CLI) -->
  <path d="M 185,256 L 205,240 M 185,256 L 205,272" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Blinking Green Prompt Cursor -->
  <line x1="215" y1="272" x2="230" y2="272" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
</svg>