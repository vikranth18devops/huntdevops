# HuntDevOps Helm Chart Values Architecture
global:
  environment: production
  appName: huntdevops

frontend:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/project-e746f24e-392a-429f-a4d/huntdevops-repo/frontend
    pullPolicy: Always
    tag: "cb0f2958de150fc898f64a0dbe5809ae8836535d"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/project-e746f24e-392a-429f-a4d/huntdevops-repo/backend
    pullPolicy: Always
    tag: "cb0f2958de150fc898f64a0dbe5809ae8836535d"

  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  env:
    NODE_ENV: production
    PORT: "4000"
    DB_HOST: "10.154.0.3"
    DB_PORT: "5432"
    DB_NAME: huntdevops
    DB_USER: postgres
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  auth:
    database: huntdevops
    username: postgres
    passwordSecretName: huntdevops-postgres-secret
    passwordSecretKey: postgres-password
    rawPassword: "HuntDevOpsCloudSQL2026!"
  persistence:
    enabled: false
    size: 10Gi
    storageClass: standard-rwo

traefik:
  enabled: true
  domain: huntdevops.online

ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: huntdevops.online
      paths:
        - path: /api
          pathType: Prefix
          serviceName: huntdevops-backend
          servicePort: 4000
        - path: /
          pathType: Prefix
          serviceName: huntdevops-frontend
          servicePort: 80
    - host: www.huntdevops.online
      paths:
        - path: /api
          pathType: Prefix
          serviceName: huntdevops-backend
          servicePort: 4000
        - path: /
          pathType: Prefix
          serviceName: huntdevops-frontend
          servicePort: 80

