apiVersion: v1
kind: Service
metadata:
  name: huntdevops-postgres
  labels:
    {{- include "huntdevops.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/component: postgresql
